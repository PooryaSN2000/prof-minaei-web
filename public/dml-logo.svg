    <circle cx="28" cy="18" r="7" fill="#0284c7" />
    <circle cx="14" cy="38" r="5.5" fill="#0ea5e9" />
    <circle cx="42" cy="38" r="5.5" fill="#06b6d4" />
    <circle cx="28" cy="32" r="4" fill="#38bdf8" />
    
