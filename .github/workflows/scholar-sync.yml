name: Sync Google Scholar Stats

on:
  schedule:
    # Runs every Monday at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch live Scholar metrics
        run: |
          python scripts/sync_scholar.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/scholar_stats.json src/data/publications.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: sync Google Scholar stats [skip ci]"
          git push
